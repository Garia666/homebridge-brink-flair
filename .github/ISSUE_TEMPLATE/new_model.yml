name: Works with my unit
description: Report a Brink model that works (or not), to update the compatibility table
labels: [compatibility]
body:
  - type: input
    id: model
    attributes:
      label: Brink unit
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options: [Everything works, Partly works, Does not work]
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Plugin settings page > Diagnostics > Copy diagnostics, and paste here.
